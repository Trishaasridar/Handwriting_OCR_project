# Handwriting OCR Application v2 - Docker Compose Configuration

version: '3.8'

services:
  # Main application service
  app:
    build: .
    container_name: handwriting-ocr-app
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - DB_HOST=db
      - DB_USER=ocr_user
      - DB_PASSWORD=ocr_password_2026
      - DB_NAME=ocr_db
      - SECRET_KEY=your-production-secret-key-here
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL database service
  db:
    image: mysql:8.0
    container_name: handwriting-ocr-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: ocr_db
      MYSQL_USER: ocr_user
      MYSQL_PASSWORD: ocr_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ocr_user", "-pocr_password_2026"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: handwriting-ocr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    profiles:
      - cache

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: handwriting-ocr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - proxy

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: handwriting-ocr-network

# Usage examples:
#
# Start basic application:
# docker-compose up -d
#
# Start with caching:
# docker-compose --profile cache up -d
#
# Start with reverse proxy:
# docker-compose --profile proxy up -d
#
# Start everything:
# docker-compose --profile cache --profile proxy up -d
#
# View logs:
# docker-compose logs -f app
#
# Stop all services:
# docker-compose down
#
# Stop and remove volumes:
# docker-compose down -v